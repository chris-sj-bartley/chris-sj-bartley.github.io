name: Weekly research report

# Drafts a Steven-Pinker-style weekly progress report from Titan (experiments),
# Overleaf (writing), and GitHub (code), then opens a PR. Nothing is published
# until Chris reviews and merges — see automation/README.md.

on:
  schedule:
    # 08:00 UTC every Friday. Cron is UTC; adjust if you want a different local time.
    - cron: "0 8 * * 5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Generate report draft
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_REPORT_TOKEN: ${{ secrets.GH_REPORT_TOKEN }}
          OVERLEAF_GIT_URL: ${{ secrets.OVERLEAF_GIT_URL }}
          TITAN_REPORT_REPO: ${{ secrets.TITAN_REPORT_REPO }}
          TITAN_REPORT_TOKEN: ${{ secrets.TITAN_REPORT_TOKEN }}
        run: python automation/generate_report.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly report draft (${{ steps.gen.outputs.week_tag }})"
          branch: "weekly-report/${{ steps.gen.outputs.week_tag }}"
          delete-branch: true
          title: "Weekly report draft — ${{ steps.gen.outputs.week_tag }}"
          body: |
            Auto-generated draft of this week's research report.

            **Review before merging** — check the results and claims against what
            actually happened. Merging publishes it to the blog. To also send it
            to the Gaelg AI blog, change `crosspost: false` to `true` in the post
            front matter before merging.
          labels: weekly-report
