name: Weekly research report

# Drafts a Steven-Pinker-style weekly progress report from Titan (experiments),
# Overleaf (writing), and GitHub (code), then opens a PR. The drafting runs via
# the Claude Code Action authenticated with Chris's Claude subscription (an OAuth
# token, not API billing). Nothing is published until the PR is reviewed and
# merged — see automation/README.md.

on:
  schedule:
    # 08:00 UTC every Friday. Cron is UTC; adjust for a different local time.
    - cron: "0 8 * * 5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Install figure tools (graphviz; matplotlib via requirements)
        # The drafting model draws tagged figures itself with graphviz/matplotlib
        # (understanding the TikZ at a high level), rather than compiling LaTeX.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Restore report state
        # Persisted last-run time + Overleaf content hashes, so the report covers
        # what changed SINCE THE LAST REPORT (not a fixed, unreliable git window).
        uses: actions/cache/restore@v4
        with:
          path: automation/_state
          key: report-state-${{ github.run_id }}
          restore-keys: |
            report-state-

      - name: Gather the week's material, render figures, prepare the post
        id: gather
        env:
          GH_REPORT_TOKEN: ${{ secrets.GH_REPORT_TOKEN }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: python automation/generate_report.py

      - name: Save report state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/_state
          key: report-state-${{ github.run_id }}

      - name: Draft the report body with Claude (subscription auth)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Read automation/_work/report-brief.md and follow its instructions exactly."
          # Bash lets it draw figures (graphviz/matplotlib) and view the results;
          # more turns because figure generation iterates (draw → look → revise).
          claude_args: "--model claude-opus-4-8 --max-turns 40 --allowedTools Read,Edit,Write,Glob,Grep,Bash"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # Commit the generated post and any plots (both live under site/).
          # Scoped to site/ so the gathered raw material in automation/_work/
          # (unpublished experiment data / draft prose) is never committed — it's
          # gitignored and outside this path anyway. Using the site/ directory
          # rather than narrower globs avoids a fatal "pathspec did not match"
          # when a quiet week produces no plots.
          add-paths: site
          commit-message: "Weekly report draft (${{ steps.gather.outputs.week_tag }})"
          branch: "weekly-report/${{ steps.gather.outputs.week_tag }}"
          delete-branch: true
          title: "Weekly report draft — ${{ steps.gather.outputs.week_tag }}"
          body: |
            Auto-generated draft of this week's research report.

            **Review before merging** — check the results and claims against what
            actually happened. Merging publishes it to the blog. To also send it
            to the Gaelg AI blog, change `crosspost: false` to `true` in the post
            front matter before merging.
          labels: weekly-report
